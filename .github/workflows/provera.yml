# Provera na svakoj grani i svakom pull request-u — gradi sajt i proverava veze,
# ali ništa ne objavljuje. Objavljuje se isključivo sa main grane.
name: Provera

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  provera:
    name: Izgradnja i provera veza
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Izgradi sajt
        run: node scripts/build.mjs

      - name: Proveri interne veze
        run: node scripts/proveri-veze.mjs

      - name: Prijavi rezultat
        run: echo "Sajt se uspešno gradi. Spreman za spajanje u main."
