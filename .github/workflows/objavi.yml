name: Objavi prodavnicu

on:
  push:
    branches:
      - verzija/v2.0-univerzalna-platforma
    tags:
      - "prodavnica-v2-*"
  pull_request:
    branches:
      - verzija/v2.0-univerzalna-platforma
  workflow_dispatch:

# Samo push namenskog V2 release taga ulazi u serijsku production grupu i
# nikada se ne prekida. PR, push kanonske V2 grane i ručna verification-only
# provera imaju zasebne, otkazive CI grupe.
concurrency:
  group: >-
    ${{ github.event_name == 'push'
        && startsWith(github.ref, 'refs/tags/prodavnica-v2-')
        && format('production-{0}', github.repository)
        || github.event_name == 'pull_request'
        && format('ci-{0}-pr-{1}', github.repository, github.event.pull_request.number)
        || format('ci-{0}-{1}', github.repository, github.ref) }}
  cancel-in-progress: >-
    ${{ !(github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/prodavnica-v2-')) }}

permissions:
  contents: read

env:
  NODE_VERSION: "22"

jobs:
  provera:
    name: Provera verzije
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: provera
          POSTGRES_PASSWORD: provera
          POSTGRES_DB: provera
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U provera -d provera"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      CI: "true"
      DATABASE_URL: postgresql://provera:provera@127.0.0.1:5432/provera?schema=public
      # libpq/psql ne poznaje Prisma `schema` query parametar.
      PSQL_DATABASE_URL: postgresql://provera:provera@127.0.0.1:5432/provera
      NEXTAUTH_SECRET: ci-nextauth-secret-nije-za-produkciju
      AUTH_VERIFIED_LOGIN_POLICY: audit
      ORDER_ACCESS_SECRET: ci-order-secret-nije-za-produkciju
      NEXTAUTH_URL: https://ci.example.invalid
      NEXT_PUBLIC_SITE_URL: https://ci.example.invalid
      NEXT_PUBLIC_CARD_PAYMENTS_ENABLED: "false"

    steps:
      - name: Preuzmi kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Potvrdi identitet V2 prodavnice
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f next.config.ts
          test -f prisma/schema.prisma
          test -f scripts/deploy.sh
          test -f app/api/health/route.ts
          test ! -f scripts/build.mjs

      - name: Postavi Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instaliraj zavisnosti
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Proveri Prisma šemu
        run: npx prisma validate

      - name: Primeni migracije na praznu CI bazu
        run: npx prisma migrate deploy

      - name: Potvrdi da migracije nemaju drift prema Prisma šemi
        run: >-
          npx prisma migrate diff
          --from-schema-datasource prisma/schema.prisma
          --to-schema-datamodel prisma/schema.prisma
          --exit-code

      - name: Proveri DB invarijante
        run: >-
          psql "$PSQL_DATABASE_URL"
          -v ON_ERROR_STOP=1
          -f scripts/db-invariant-smoke.sql

      - name: Proveri izolovane verified-login audit fixture-e
        env:
          AUTH_AUDIT_TEST_DATABASE_URL: ${{ env.PSQL_DATABASE_URL }}
        run: node --import tsx scripts/test-auth-email-verification-audits.ts

      - name: Proveri lint pravila
        run: npm run lint -- --quiet

      - name: Proveri TypeScript
        run: npm run typecheck

      - name: Pokreni sigurnosne i DB testove
        env:
          RUN_RESERVATION_CLEANUP_DB_TESTS: "true"
          RUN_AUTH_VERIFICATION_DB_TESTS: "true"
          RUN_PASSWORD_RESET_CONFIRM_DB_TESTS: "true"
          RUN_REGISTRATION_DB_TESTS: "true"
          RUN_EMAIL_VERIFICATION_RESEND_DB_TESTS: "true"
          RUN_VERIFIED_LOGIN_DB_TESTS: "true"
          RUN_AUTH_SESSION_DB_TESTS: "true"
          RUN_AUTH_SESSION_EXPAND_PREFLIGHT_DB_TESTS: "true"
          RUN_DEMO_USER_SYNC_DB_TESTS: "true"
        run: npm test

      - name: Instaliraj Chromium za browser smoke test
        run: npx playwright install --with-deps chromium

      - name: Proveri mobilni tok kupovine
        run: npm run test:e2e

      - name: Probna produkcijska izgradnja
        run: npm run build

  potvrdi_release:
    name: Potvrdi V2 release
    needs: provera
    if: >-
      ${{ github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/prodavnica-v2-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Preuzmi release kandidat
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Potvrdi V2 release tag i commit pre Environment-a
        shell: bash
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f next.config.ts
          test -f prisma/schema.prisma
          test -f scripts/deploy.sh
          test -f app/api/health/route.ts
          test ! -f scripts/build.mjs
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$RELEASE_TAG" =~ ^prodavnica-v2-[0-9]{8}-[1-9][0-9]*$ ]] || {
            echo "Release tag mora imati oblik prodavnica-v2-YYYYMMDD-N" >&2
            exit 1
          }
          git merge-base --is-ancestor \
            "$GITHUB_SHA" \
            "origin/verzija/v2.0-univerzalna-platforma" || {
            echo "Release commit nije deo kanonske V2 grane" >&2
            exit 1
          }

  objavi:
    name: Objavi na produkciju
    needs:
      - provera
      - potvrdi_release
    # Ručni dispatch i običan push V2 grane su verification-only. Tek uspešna
    # CI i pre-Environment provera namenskog release taga mogu otvoriti
    # production Environment gate.
    if: >-
      ${{ github.event_name == 'push'
          && startsWith(github.ref, 'refs/tags/prodavnica-v2-') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment:
      name: production
      url: ${{ vars.PRODUCTION_URL }}
    env:
      SERVER_PORT: ${{ vars.SERVER_PORT || '22' }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/var/www/narodnanosnja' }}
      PRODUCTION_URL: ${{ vars.PRODUCTION_URL }}
      APP_PORT: ${{ vars.APP_PORT || '3007' }}
      SMOKE_PORT: ${{ vars.SMOKE_PORT || '39007' }}
      APP_NAME: ${{ vars.APP_NAME || 'narodnanosnja' }}
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_ID: ${{ github.sha }}-${{ github.run_attempt }}

    steps:
      - name: Preuzmi provereni kod
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ponovo potvrdi V2 release tag i commit pre SSH-a
        shell: bash
        run: |
          set -euo pipefail
          test -f package.json
          test -f package-lock.json
          test -f next.config.ts
          test -f prisma/schema.prisma
          test -f scripts/deploy.sh
          test -f app/api/health/route.ts
          test ! -f scripts/build.mjs
          [[ "$GITHUB_REF_TYPE" == "tag" ]]
          [[ "$RELEASE_TAG" =~ ^prodavnica-v2-[0-9]{8}-[1-9][0-9]*$ ]] || {
            echo "Release tag mora imati oblik prodavnica-v2-YYYYMMDD-N" >&2
            exit 1
          }
          git merge-base --is-ancestor \
            "$GITHUB_SHA" \
            "origin/verzija/v2.0-univerzalna-platforma" || {
            echo "Release commit nije deo kanonske V2 grane" >&2
            exit 1
          }

      - name: Proveri deploy podešavanja
        shell: bash
        run: |
          : "${PRODUCTION_URL:?Nedostaje variable PRODUCTION_URL}"

          [[ "$SERVER_PORT" =~ ^[1-9][0-9]{0,4}$ ]] &&
            (( SERVER_PORT <= 65535 )) || {
            echo "SERVER_PORT nije validan" >&2
            exit 1
          }
          [[ "$APP_PORT" =~ ^[1-9][0-9]{0,4}$ ]] &&
            (( APP_PORT <= 65535 )) || {
            echo "APP_PORT nije validan" >&2
            exit 1
          }
          [[ "$SMOKE_PORT" =~ ^[1-9][0-9]{0,4}$ ]] &&
            (( SMOKE_PORT <= 65535 )) || {
            echo "SMOKE_PORT nije validan" >&2
            exit 1
          }
          [[ "$SMOKE_PORT" != "$APP_PORT" ]] || {
            echo "SMOKE_PORT i APP_PORT moraju biti različiti" >&2
            exit 1
          }
          [[ "$APP_NAME" =~ ^[A-Za-z0-9._-]{1,64}$ ]] || {
            echo "APP_NAME nije validan" >&2
            exit 1
          }
          [[ "$DEPLOY_PATH" =~ ^/(var/www|srv)/[A-Za-z0-9._/-]+$ ]] &&
            [[ "$DEPLOY_PATH" != *'/../'* ]] &&
            [[ "$DEPLOY_PATH" != *'/./'* ]] &&
            [[ "$DEPLOY_PATH" != *'//'* ]] &&
            [[ "$DEPLOY_PATH" != */ ]] || {
            echo "DEPLOY_PATH mora biti bezbedna aplikaciona putanja pod /var/www ili /srv" >&2
            exit 1
          }
          [[ "$PRODUCTION_URL" =~ ^https://[^[:space:]]+$ ]] || {
            echo "PRODUCTION_URL mora biti puna HTTPS adresa" >&2
            exit 1
          }
          [[ "$RELEASE_ID" =~ ^[0-9a-f]{40}-[0-9]+$ ]] || {
            echo "RELEASE_ID nije validan" >&2
            exit 1
          }

      - name: Pripremi verifikovan SSH pristup
        shell: bash
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
          SERVER_HOST: ${{ secrets.SERVER_HOST }}
          SERVER_USER: ${{ secrets.SERVER_USER }}
        run: |
          : "${SSH_PRIVATE_KEY:?Nedostaje secret SSH_PRIVATE_KEY}"
          : "${SSH_KNOWN_HOSTS:?Nedostaje secret SSH_KNOWN_HOSTS}"
          : "${SERVER_HOST:?Nedostaje secret SERVER_HOST}"
          : "${SERVER_USER:?Nedostaje secret SERVER_USER}"
          [[ "$SERVER_HOST" =~ ^[A-Za-z0-9._:-]+$ ]] || {
            echo "SERVER_HOST nije validan" >&2
            exit 1
          }
          [[ "$SERVER_USER" =~ ^[A-Za-z_][A-Za-z0-9_-]*$ ]] || {
            echo "SERVER_USER nije validan" >&2
            exit 1
          }

          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$HOME/.ssh/deploy_key"
          printf '%s\n' "$SSH_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/deploy_key" "$HOME/.ssh/known_hosts"
          {
            printf 'Host production\n'
            printf '  HostName %s\n' "$SERVER_HOST"
            printf '  User %s\n' "$SERVER_USER"
            printf '  Port %s\n' "$SERVER_PORT"
            printf '  IdentityFile %s/.ssh/deploy_key\n' "$HOME"
            printf '  IdentitiesOnly yes\n'
            printf '  BatchMode yes\n'
            printf '  StrictHostKeyChecking yes\n'
            printf '  UserKnownHostsFile %s/.ssh/known_hosts\n' "$HOME"
          } > "$HOME/.ssh/config"
          chmod 600 "$HOME/.ssh/config"
          ssh production true

      - name: Otvori novu release fasciklu
        shell: bash
        run: |
          RELEASE_DIR="${DEPLOY_PATH%/}/releases/${RELEASE_ID}"
          ssh production \
            "set -eu; test -f '${DEPLOY_PATH%/}/.env'; mkdir -p '${DEPLOY_PATH%/}/releases'; test ! -e '$RELEASE_DIR'; mkdir '$RELEASE_DIR'"

      - name: Pošalji kod u izolovani release
        shell: bash
        run: |
          RELEASE_DIR="${DEPLOY_PATH%/}/releases/${RELEASE_ID}"
          rsync -az --delete-delay \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude '.env' \
            --exclude '.next/' \
            --exclude 'node_modules/' \
            --exclude 'public/uploads/' \
            ./ "production:${RELEASE_DIR}/"

      - name: Izgradi, proveri i atomski aktiviraj release
        shell: bash
        run: |
          RELEASE_DIR="${DEPLOY_PATH%/}/releases/${RELEASE_ID}"
          printf -v REMOTE_COMMAND \
            'PRODUCTION_URL=%q APP_PORT=%q SMOKE_PORT=%q APP_NAME=%q APPLY_DATABASE_MIGRATIONS=false bash %q' \
            "$PRODUCTION_URL" "$APP_PORT" "$SMOKE_PORT" "$APP_NAME" \
            "$RELEASE_DIR/scripts/deploy.sh"
          ssh production "$REMOTE_COMMAND"

      - name: Ukloni neuspešan release
        if: failure()
        shell: bash
        run: |
          if [[ -f "$HOME/.ssh/config" ]]; then
            RELEASE_DIR="${DEPLOY_PATH%/}/releases/${RELEASE_ID}"
            CURRENT_LINK="${DEPLOY_PATH%/}/current"
            DEPLOY_LOCK="${DEPLOY_PATH%/}/.deploy.lock"
            printf -v CLEANUP_BODY \
              'ACTIVE=$(readlink -f %q 2>/dev/null || true); if [[ -d %q && "$ACTIVE" != %q ]]; then rm -rf -- %q; fi' \
              "$CURRENT_LINK" "$RELEASE_DIR" "$RELEASE_DIR" "$RELEASE_DIR"
            printf -v CLEANUP_COMMAND \
              'flock -w 180 %q bash -c %q' \
              "$DEPLOY_LOCK" "$CLEANUP_BODY"
            ssh production "$CLEANUP_COMMAND" || true
          fi

      - name: Ukloni privatni ključ sa runner-a
        if: always()
        run: rm -f "$HOME/.ssh/deploy_key"
