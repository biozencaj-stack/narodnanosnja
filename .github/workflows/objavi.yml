# Svaki push na main gradi sajt i objavljuje novu verziju na GitHub Pages.
name: Objavi sajt

on:
  push:
    branches: [main]
  workflow_dispatch: # omogućava ručno pokretanje iz Actions kartice

# Dozvole potrebne za objavljivanje na Pages.
permissions:
  contents: read
  pages: write
  id-token: write

# Ako stignu dva push-a jedan za drugim, pusti da se prvi objavi do kraja.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  gradi:
    name: Izgradnja
    runs-on: ubuntu-latest
    steps:
      - name: Preuzmi kod
        uses: actions/checkout@v4

      - name: Postavi Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Podesi Pages
        id: pages
        uses: actions/configure-pages@v5
        with:
          # Uključuje GitHub Pages na repozitorijumu ako već nije uključen.
          enablement: true

      - name: Izgradi sajt
        run: node scripts/build.mjs
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Proveri interne veze
        run: node scripts/proveri-veze.mjs
        env:
          BASE_PATH: ${{ steps.pages.outputs.base_path }}

      - name: Spakuj rezultat
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  objavi:
    name: Objavljivanje
    needs: gradi
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.objava.outputs.page_url }}
    steps:
      - name: Objavi na GitHub Pages
        id: objava
        uses: actions/deploy-pages@v4
